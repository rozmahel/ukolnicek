<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Úkolníček</title>
<meta name="description" content="Školní poznámky, úkoly a rozvrh na jednom místě.">
<meta name="theme-color" content="#FCFBFE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Úkolníček">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<!-- styly po oblastech; na pořadí záleží (pozdější soubor může přebít dřívější) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/sync.css">
<link rel="stylesheet" href="css/responsive.css">
<script>
/* režim (světlý/tmavý), velikost textu a kopie barevného motivu jsou uložené v tomto zařízení; nastaví se hned, aby stránka nepoblikla */
try{var t=JSON.parse(localStorage.getItem('uk-theme')||'"auto"');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
var k=JSON.parse(localStorage.getItem('uk-skin')||'""');if(k==='paper'||k==='forest')document.documentElement.setAttribute('data-skin',k);
var f=+JSON.parse(localStorage.getItem('uk-fs')||'1');if(f>1&&f<=1.6)document.documentElement.style.setProperty('--fs',f);}catch(e){}
</script>
</head>
<body>
<div id="app">
  <aside class="side" id="side" aria-label="Navigace"></aside>
  <div class="scrim" id="scrim" data-act="menu"></div>
  <main id="main">
    <div class="topbar"><button class="icon-btn" data-act="menu" aria-label="Menu">☰</button><span class="tb-t" id="tb-t">Úkolníček</span><span class="tb-sync" id="tb-sync"></span></div>
    <div id="view"><div class="loading">Načítám tvoje stránky…</div></div>
  </main>
</div>
<div class="fmt" id="fmt" hidden></div>
<div class="cellbar" id="cellbar" hidden>
  <button data-lt="p">Text</button><button data-lt="bullet">• Odrážka</button><button data-lt="todo">☐ Úkol</button><button data-lt="img">▣ Obrázek</button><button data-lt="link">🔗 Odkaz</button>
</div>
<div class="upd" id="upd" hidden role="status"><span>Je dostupná nová verze Úkolníčku.</span><button id="upd-btn">Obnovit</button></div>
<noscript><p style="padding:24px">Úkolníček potřebuje zapnutý JavaScript.</p></noscript>
<script src="js/storage.js"></script>
<script src="js/driveSync.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
