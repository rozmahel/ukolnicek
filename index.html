<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Úkolníček</title>
<meta name="description" content="Školní poznámky, úkoly a rozvrh na jednom místě.">
<meta name="theme-color" content="#FCFBFE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18161D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Úkolníček">
<link rel="stylesheet" href="lib/fonts/fonts.css">
<!-- styly po oblastech; na pořadí záleží (pozdější soubor může přebít dřívější) -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/themes.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/controls.css">
<link rel="stylesheet" href="css/editor.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/today.css">
<link rel="stylesheet" href="css/schedule.css">
<link rel="stylesheet" href="css/index.css">
<link rel="stylesheet" href="css/settings.css">
<link rel="stylesheet" href="css/sync.css">
<link rel="stylesheet" href="css/draw.css">
<link rel="stylesheet" href="css/mindmap.css">
<link rel="stylesheet" href="css/ai.css">
<link rel="stylesheet" href="css/responsive.css">
<script>
/* režim (světlý/tmavý), velikost textu a kopie barevného motivu jsou uložené v tomto zařízení; nastaví se hned, aby stránka nepoblikla */
try{var t=JSON.parse(localStorage.getItem('uk-theme')||'"auto"');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);
var k=JSON.parse(localStorage.getItem('uk-skin')||'""');if(['paper','forest','mist','rose','lavender'].indexOf(k)>=0)document.documentElement.setAttribute('data-skin',k);
var n=JSON.parse(localStorage.getItem('uk-font')||'""');if(['onest','plex','system','newsreader','literata','sserif'].indexOf(n)>=0)document.documentElement.setAttribute('data-font',n);
var f=+JSON.parse(localStorage.getItem('uk-fs')||'1');f=Math.min(1.4,Math.round(f*10)/10);if(f>1)document.documentElement.style.setProperty('--fs',f);}catch(e){}
</script>
</head>
<body>
<div id="app">
  <aside class="side" id="side" aria-label="Navigace"></aside>
  <div class="scrim" id="scrim" data-act="menu"></div>
  <!-- #panes: #main = aktivní polovina; při rozdělené obrazovce (js/split.js) přibude táhlo a náhled druhé stránky -->
  <div id="panes">
  <main id="main">
    <div class="topbar"><button class="icon-btn" data-act="menu" aria-label="Menu">☰</button><span class="tb-t" id="tb-t">Úkolníček</span><span class="tb-sync" id="tb-sync"></span></div>
    <div id="view"><div class="loading">Načítání stránek…</div></div>
  </main>
  </div>
</div>
<div class="fmt" id="fmt" hidden></div>
<div class="cellbar" id="cellbar" hidden>
</div>
<div class="upd" id="upd" hidden role="status"><span>Je dostupná nová verze Úkolníčku.</span><button id="upd-btn">Obnovit</button><button id="upd-x" class="x" aria-label="Skrýt" title="Skrýt (nová verze se nasadí sama po zavření appky)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg></button></div>
<noscript><p style="padding:24px">Úkolníček potřebuje zapnutý JavaScript.</p></noscript>
<script src="js/storage.js"></script>
<script src="js/driveSync.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
